services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      BACKEND_HOST: ${BACKEND_HOST:-0.0.0.0}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      PORT: ${BACKEND_PORT:-8000}
      COMPOSIO_ENABLED: ${COMPOSIO_ENABLED:-1}
      COMPOSIO_CLI_PATH: ${COMPOSIO_CLI_PATH:-/root/.composio/composio}
      COMPOSIO_TIMEOUT_SECONDS: ${COMPOSIO_TIMEOUT_SECONDS:-30}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app/backend
      - ${HOME}/.composio:/root/.composio:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python - <<'PY'\nimport os, urllib.request\nurl = f\"http://127.0.0.1:{os.getenv('PORT', '8000')}/health\"\nurllib.request.urlopen(url, timeout=3).read()\nPY"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      FRONTEND_HOST: ${FRONTEND_HOST:-0.0.0.0}
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    depends_on:
      backend:
        condition: service_started

volumes:
  frontend_node_modules:
